# Variant B overlay: merged over design.yaml when EARRING_VARIANT=b
# (python3 build.py --variant b). design/variant-b-matrix.md has the why.
leds:
  drive: matrix          # one IS31FL3741A (U11) driving plain RGB LEDs
  part: rgb_led          # XL-1010RGB-YG, 1 x 1 mm, common anode
  matrix:
    sw: 9                # SW lines scanned (SWS register); 9 -> 1/9 duty
    per_sw: 5            # LEDs per SW line -> 15 CS lines used
    bus: sw              # which lines run round the ring: "sw" = 9-line SW
                         # bus, CS triplets local to 9-LED arcs (circuit.py
                         # led_matrix). "cs" was a 15-line bus: ~80 open on
                         # every seed (2026-11-03 sweep).
    riset: 47k           # design/parts/is31fl3741a.md: sized for the dim range
    riset_part: r_47k
    bulk: 10u            # PVCC bulk (audit: 22u not needed)
    bulk_part: c_10u_0603
    i2c_pullup: 4.7k     # I2C0 to the driver, 400 kHz
    i2c_pullup_part: r_4k7
