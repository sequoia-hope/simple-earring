# simple_earring test firmware — RP2354A (RP2350A core, 2MB in-package flash)
# Same proven recipe as rp2350-motor-controller: maxgerhardt platform +
# earlephilhower arduino-pico core, generic_rp2350 with 2MB flash.
[env:earring]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic_rp2350
framework = arduino
board_build.core = earlephilhower
board_upload.flash_size = 2097152
board_upload.maximum_size = 2097152
; 512KB LittleFS for wear-log sessions (~12KB/min at 10Hz -> a dozen
; 3-minute protocol runs with rolling deletion of the oldest)
board_build.filesystem_size = 524288
; 50MHz (default 150): roughly halves the awake-MCU draw, the biggest
; single battery lever. Safe: NeoPixel PIO divider is computed from the
; live clk_sys at strip.begin(), USB runs from its own 48MHz PLL, ADC
; from clk_adc. If USB-CDC ever misbehaves at 50, fall back to 100.
board_build.f_cpu = 50000000L

build_flags =
    -D__PICO_RP2350A=1

monitor_speed = 115200
