# simple_earring test firmware — RP2354A (RP2350A core, 2MB in-package flash)
# Same proven recipe as rp2350-motor-controller: maxgerhardt platform +
# earlephilhower arduino-pico core, generic_rp2350 with 2MB flash.
[env:earring]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = generic_rp2350
framework = arduino
board_build.core = earlephilhower
board_upload.flash_size = 2097152
board_upload.maximum_size = 2097152
board_build.filesystem_size = 65536

build_flags =
    -D__PICO_RP2350A=1

monitor_speed = 115200
