# Parts database: every placeable part with LCSC number + footprint.
# footprint: "<name>" refers to library/parts.pretty/<name>.kicad_mod
# verified: yes = LCSC number confirmed against datasheet/prior build this project
#           prior = proven on a previous board of ours (earring / rp2350a-compact / pendant)
#           check = plausible but must be validated before ordering (see notes)

mcu:
  mpn: RP2350A
  lcsc: C42411118
  footprint: RP2350-QFN-60-1EP_7x7_P0.4mm_EP3.4x3.4mm_ThermalVias
  verified: yes          # 2026-08-05: LCSC 7251 in stock, $1.71@1; QFN-60-EP(7x7)
  notes: no internal flash (RP2354A C41378174 was OOS) -> external QSPI
    flash U6; pinout identical to RP2354A, same footprint. QSPI_SS still
    doubles as the BOOTSEL strap (button + 1k), flash /CS rides the same
    net (Pico-style, no series link).

flash:
  mpn: W25Q16JVUXIQ
  lcsc: C2843335
  footprint: USON-8_L3.0-W2.0-P0.50-BL-EP
  verified: yes          # 2026-08-05: LCSC 16994 in stock, $1.63@1/$0.85@1k
  notes: 16Mbit (2MB, same as RP2354A internal) QSPI NOR, 2.7-3.6V, 133MHz,
    USON-8-EP 2x3mm. Footprint+WRL via easyeda2kicad C2843335; pads
    0.6x0.28 @ 0.5mm pitch, rows 3.02mm apart, 0.3x1.7 center EP (GND).
    Pinout 1=/CS 2=DO(IO1) 3=/WP(IO2) 4=GND 5=DI(IO0) 6=CLK 7=/HOLD(IO3)
    8=VCC — wiring copied from RPI-RP2350A-MINIMAL R4 (docs/).

led:
  mpn: SK6805-EC10-000
  lcsc: C22394946
  footprint: LED_SK6805-EC10
  verified: yes          # 2026-08-05: LCSC 4095 in stock (~91 boards at 45/ea),
                         # $0.096@5. Datasheet REV.01 checked (OPSCO).
  notes: >
    Replaces TBA-C1010MB-J2I16 (C22461778, down to 15 pcs). Pinout
    1=GND 2=DIN 3=VDD 4=DOUT — see LED_PIN in circuit.py; PHYSICAL pad
    layout is identical to the TBA part (DI top-left, VDD bottom-left,
    GND top-right, DO bottom-right, 0.68mm diagonal grid) so ring
    placement and the locked chain arcs are unchanged. Body 1.1x1.1mm
    (was 1.0), pads 0.37 at +-0.34 (were 0.45 at +-0.35).
    VDD 3.7-5.5V: still above the LiR2032's 3.0V floor but the BEST of
    the in-stock 1010 options (XL-1010RGBC-2812B C5349953 needs
    4.5-5.5V; the outgoing TBA wanted 4.2V) — LEDs dim near end of
    discharge, same compromise the board already shipped with.
    VIH = 0.7*VDD -> 2.94V at 4.2V, so 3.3V GPIO data still clears it.
    800kHz protocol, IDD 0.3mA quiescent each.
    Footprint/WRL via easyeda2kicad C22394946; it is the datasheet land
    rotated 90 CW (pure rotation, verified pad-by-pad against REV.01
    sections 4-6) and place.py's k-loop picks the right quadrant.

charger:
  mpn: LGS4056HDA
  lcsc: C5124109
  footprint: DFN-8-1EP_2x2mm_P0.5mm_EP0.9x1.5mm
  verified: prior        # earring used C5124109 with this footprint
  notes: I_BAT=900/R_PROG (<300mA); TEMP->GND disables NTC; CE->VCC; 10uF on VCC & BAT

ldo:
  mpn: NCP730BMT330TBG
  lcsc: C892821
  footprint: WDFN-6-2x2
  verified: prior        # earring
  notes: 3.3V 150mA, ~1uA Iq

load_switch:
  mpn: TPS22913BYZVR
  lcsc: C544698
  footprint: YZV0004ADAD
  verified: prior        # earring; 4-ball CSP, ON active high
  notes: switches VBATT -> VLED

usb_conn:
  mpn: TYPE-C-31-M-12
  lcsc: C165948
  footprint: USB-C_SMD-TYPE-C-31-M-12_1
  verified: yes          # HRO right-angle 16p SMD, EasyEDA footprint+3D

usb_esd:
  mpn: USBLC6-2P6
  lcsc: C2827693
  footprint: SOT-666
  verified: prior        # earring

crystal:
  mpn: TXM12M0004252FBCEO00T
  lcsc: C284155
  footprint: Crystal_SMD_2520-4Pin_2.5x2.0mm
  verified: prior        # earring; 12MHz 12pF SMD2520-4P
  notes: pins 1/3 = crystal, 2/4 = GND (verify pad map at board gen)

vreg_inductor:
  mpn: AOTA-B201610S3R3-101-T
  lcsc: C42411119
  footprint: L_pol_2016
  verified: check        # from funvill RP2350A minimal BOM; footprint from pendant
  notes: >-
    3.3uH for RP2350 internal VREG. POLARITY MATTERS (ds §6.3.8.3 / Fig 23):
    orientation dot must land on the VOUT pad = L1 pad 1 (netlist swapped
    accordingly). Footprint L_pol_2016 draws its dot at pad 1 — confirm
    against the Abracon drawing that the physical dot end maps to pad 1 in
    JLC assembly orientation before ordering.

battery_clip:
  mpn: CR2032-W
  lcsc: C70373
  footprint: BAT_CR2032_W
  verified: yes          # datasheet fetched, footprint generated from drawing
  notes: clip=+ (cell can/sides), center pad=-; cell inserted + marking outward

bootsel_button:
  mpn: SKRPAME010
  lcsc: C19724063
  footprint: KEY-SMD_4P-L4.2-W3.2-P2.20-LS4.6
  verified: check        # ALPS SKRP 4-pin tact; footprint via easyeda2kicad
  notes: >-
    Replaces TS-1101-C-W (C318938, 2-pad, 8.0mm land span). Body 4.2x3.2mm,
    lead span 4.6mm, pads at (+-2.10, +-1.07) — strictly smaller than the
    part it replaced, so it fits the old placement with room to spare.
    Pins 1-2 are one contact, 3-4 the other (per the LCSC symbol); confirm
    against the ALPS drawing before ordering. 3D model is the vendor WRL in
    parts/, not the easyeda2kicad-generated one.

slide_switch:
  mpn: MSK12C02
  lcsc: C431540
  footprint: SW-TH_MSK12C02
  verified: check        # SHOU HAN SPDT side-slide 8x2.8x1.4; footprint via easyeda2kicad
  notes: >-
    Power switch on LDO EN (50mA contact rating - do NOT put battery
    current through it). Pin 2 = center = common. Knob = footprint +y.
    Two 0.9mm THT locating holes at (+-1.5, 0.55) punch through to the
    front - keep clear of front-side parts.

imu:
  mpn: LSM6DS3TR-C
  lcsc: C967633
  footprint: LGA-14_L3.0-W2.5-P0.50-TL
  verified: yes          # LCSC stock confirmed Aug 2026 (18k+ units, ~$0.99)
  notes: >-
    6-axis IMU, LGA-14 2.5x3.0mm, 1.71-3.6V, wake-on-motion INT. I2C mode 1
    per ds application hints: CS->VDDIO, SDx/SCx->VDDIO (lowest power),
    SDO/SA0->GND (addr 0x6A), INT2/NC floating. Back side, opposite SW2.

testpoint:
  mpn: ~
  lcsc: ~
  footprint: TestPoint_Pad_1.5x1.5mm
  verified: yes          # bare pad, not assembled

