crystal:
  mpn: ABM8-272-T3
  lcsc: C20625731
  footprint: Crystal_SMD_3225-4Pin_3.2x2.5mm_ABM8
  verified: yes          # Aug 5 2026: the part RPi specifies, guide §4.1
  notes: >-
    Abracon ABM8-272-T3, 12MHz, +-30ppm, CL 10pF, max ESR 50R, 3.2x2.5mm.
    Pins 1/3 = crystal terminals (diagonal), 2/4 = GND/shield — same
    convention as the 2520 it replaced, so the netlist was unchanged.
    Land pattern copied exactly from the official RPI-RP2350A-MINIMAL R4
    board in docs/ (generic_xtalcc320x250x80-4).
    WHY THIS PART: was C284155 (Yajingxin TXM12M0004252FBCEO00T, 2520)
    until Aug 5 2026. That crystal is CL 12pF / max ESR 120R, but C14/C15
    (15p) and R1 (1k) were copied from the RP2350 guide, which derives them
    for a CL 10pF / ESR<=50R crystal: 15p/2 + 3p stray = 10.5pF ~ 10pF, and
    1k is sized not to over-drive a <=50R crystal at 3.3V IOVDD. Against a
    12pF/120R part the caps ran it fast (needs 18p) and the 1k ate startup
    margin at cold. JLCPCB flagged it ("does not use the recommended crystal
    and polarised inductor circuitry"). Switching the crystal makes the
    existing 15p/1k correct again — do NOT retune them.
    A drop-in 2520 was not an option: at 12MHz the smaller blank runs
    ~100R+ ESR, which is why RPi chose a 3225.

vreg_inductor:
  mpn: AOTA-B201610S3R3-101-T
  lcsc: C42411119
  footprint: L_pol_2016
  verified: yes          # Aug 5 2026: checked against "Hardware design with
                         # RP2350" (RP-008280-DS-1) AND the official
                         # RPI-RP2350A-MINIMAL R4 board in docs/
  notes: >-
    3.3uH for RP2350 internal VREG. This IS the part Raspberry Pi specifies:
    the guide §2.1 recap names "L1 - Abracon AOTA-B201610S3R3-101-T (0806,
    2016 metric)" verbatim, and LCSC/JLCPCB C42411119 resolves to that exact
    MPN (Abracon, 3.3uH, 0806, Isat 2.4A, DCR 115mR typ; JLC lists it as an
    Extended part available for SMT assembly). Our L_pol_2016 land pattern is
    pad-for-pad identical to the official R4 board's
    abracon_aota-b201610s3r3-101-t: pads at (+-0.7, 0), 0.7 x 1.7mm.
    RPi worked with Abracon specifically so this part ships on reel with all
    dots aligned — a generic 3.3uH has randomly distributed winding direction
    and the guide is blunt that a "wrong way round" inductor lets the coil's
    stray field upset COUT and the regulator control loop ("if you choose not
    to use our example, then you do so at your own risk"). JLCPCB is known to
    challenge RP2350 designs that substitute a different inductor. Do NOT let
    a substitution through.
    POLARITY MATTERS (ds §6.3.8.3 / Fig 23): the dot must land on the VOUT
    pad = L1 pad 1 (netlist swapped accordingly); L_pol_2016 draws its dot at
    pad 1. Still worth an eyeball on the JLC assembly preview before ordering.

