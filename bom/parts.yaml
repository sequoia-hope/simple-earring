imu:
  mpn: LSM6DS3TR-C
  lcsc: C967633
  footprint: LGA-14_L3.0-W2.5-P0.50-TL
  verified: yes          # LCSC stock confirmed Aug 2026 (18k+ units, ~$0.99)
  notes: >-
    6-axis IMU, LGA-14 2.5x3.0mm, 1.71-3.6V, wake-on-motion INT. I2C mode 1
    per ds application hints: CS->VDDIO, SDx/SCx->VDDIO (lowest power),
    SDO/SA0->GND (addr 0x6A), INT2/NC floating. Back side, opposite SW2.
    PIN ORDER — the serial trio at the top of the package is 12 = CS,
    13 = SCL, 14 = SDA (ST ds DocID030071 rev 3, Table 2 / Figure 1; the
    KiCad stock Sensor_Motion:LSM6DS3 symbol agrees). circuit.py had these
    rotated by one (12 = SCL, 13 = SDA, 14 = CS) until Aug 6 2026, which is
    fatal both ways: CS would have been driven by the I2C clock, so the part
    re-entered SPI mode on every edge, and SDA — an open-drain pin — was
    strapped hard to 3V3, so the IMU would short 3V3 to ground through its
    own output FET whenever it tried to ACK. Verified pad-by-pad that the
    LGA-14_L3.0-W2.5-P0.50-TL footprint numbering matches Figure 1.

or_diode:
  mpn: BAT54SW,115
  lcsc: C78606
  footprint: SOT-323_BAT54SW
  verified: yes          # 2026-08-25: LCSC 66k in stock; Nexperia BAT54W-series
                         # ds Rev.3 Table 2 pinning quoted below
  notes: >-
    Dual SERIES Schottky (not the common-cathode BAT54CW): 1 = anode
    (diode 1), 2 = cathode (diode 2), 3 = cathode 1 + anode 2 (the
    midpoint). Diode 1 (pin1->pin3) ORs SW_ON into the LDO EN so the
    switch still enables the board; diode 2 (pin3->pin2) clamps EN to
    VBATT+Vf. The clamp is NOT optional: NCP730 ds Maximum Ratings
    table says V_EN = -0.3 to (V_IN + 0.3) — not an independent
    40V-tolerant pin — so the USB feed (R18 from VBUS) must never lift
    EN above the battery by more than a Schottky drop, including
    during precharge of a deeply dead cell. 30V / 200mA per diode.
    SOT-323 (SC-70), NOT the SOT-23 BAT54S: a placement grid scan over
    the full board (both sides, all courtyards + hole/edge rules)
    found ZERO legal spots for a SOT-23 courtyard — SC-70 fits 150+,
    including the SW2 pocket this lives in. Footprint+WRL via
    easyeda2kicad C78606 (vendor land, 0.9x0.8 pads at 1.3mm pitch);
    courtyard widened to cover the pads.

cc_diode:
  mpn: BAV70W-7-F
  lcsc: C93029
  footprint: SOT-323_BAT54SW   # same SOT-323 land as D2; only the pinning differs
  verified: yes          # Diodes Inc DS30063 rev 12 (design/datasheets/BAV70W.pdf); pinout p.1 diagram
  notes: >-
    Power-latch diode pair D4: SILICON switching diodes, common cathode
    (pin 1 = A1, pin 2 = A2, pin 3 = K, top-view diagram p.1). Chosen over
    the BAT54CW for reverse leakage: IR <= 25nA @20V/25C vs a Schottky's
    ~20uA at 85C, which would false-trigger the latch through R24 (see
    circuit.py latch block). VF <= 0.715V @1mA.

power_button:
  mpn: B3U-3000P
  lcsc: C963349
  footprint: SW_B3U-3000P
  verified: yes          # Omron ds design/datasheets/B3U-3000P.pdf p.3; JLC extended, 15.8k stock (2026-10-22)
  notes: >-
    Side-actuated tact, body 3.0x2.5x1.2(+0.15), actuator 0.7 past the body
    face, two pads, no holes/boss (NOT the -B variant, which needs a Ø0.75
