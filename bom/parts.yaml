bootsel_button:
  mpn: SKRPAME010
  lcsc: C19724063
  footprint: KEY-SMD_4P-L4.2-W3.2-P2.20-LS4.6
  verified: check        # ALPS SKRP 4-pin tact; footprint via easyeda2kicad
  notes: >-
    Replaces TS-1101-C-W (C318938, 2-pad, 8.0mm land span). Body 4.2x3.2mm,
    lead span 4.6mm, pads at (+-2.10, +-1.07) — strictly smaller than the
    part it replaced, so it fits the old placement with room to spare.
    3D model is the vendor WRL in parts/, not the easyeda2kicad-generated one.
    CONTACT PAIRING — read before changing SW1's netlist. The footprint puts
    pads 1 and 3 on ONE side of the body (x = -2.10) and 2 and 4 on the other
    (x = +2.10). A 4-terminal tact is SPST with two terminals leaving each
    side, and the two on a side are the same node, so the contacts are the
    same-side pairs {1,3} and {2,4} — NOT {1,2}/{3,4} as the LCSC symbol
    implies. circuit.py used to net {1,2} = BOOTSEL_SW and {3,4} = GND, which
    ties both nodes to both nets: BOOTSEL_SW shorted to GND, holding QSPI_SS
    low so the chip would have come up in the USB bootloader every boot and
    the flash /CS would have been fighting a 1k pulldown.
    It is now netted on the DIAGONAL only — pad 1 = BOOTSEL_SW, pad 4 = GND,
    pads 2 and 3 unnetted. Diagonal pads land on opposite contacts under
    EITHER pairing convention, so the strap is correct without needing the
    ALPS drawing (which is not downloadable) to settle it. If you do confirm
    same-side pairing from the drawing, you can add 3 -> BOOTSEL_SW and
    2 -> GND for the redundant second joint.

