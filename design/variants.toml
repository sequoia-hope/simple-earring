title = "F: E on 6 layers"
badge = "0 open on every seed"
kind = "ok"
specs = ["6 layers", "0.10 mm rules", "same placement as E", "−$3.0 vs A + 6L"]
desc = """Variant E with two more signal layers. Routes to 0 open on all six seeds in 15 minutes; the best
seeds leave two narrow-neck DRC errors to clean up. The placed board; the route is on the card below."""
docs = [{ href = "docs/variant-e.html", label = "Notes" }]
layers = "6L"
leds = "45× XL-1615RGBC"
driver = "AW20198QNR, tip pocket"
