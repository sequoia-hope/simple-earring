title = "E: back unloaded, 0.1 mm"
badge = "4 open at 110 min"
kind = "probe"
specs = ["4 layers", "0.10 mm rules", "23 parts moved", "−$3.0 vs A"]
desc = """D with 23 back parts moved off the LEDs' via room (the charger to the front), 1 mm test pads and
0.10 mm rules board-wide. 15&ndash;19 open in 15 minutes, 7 in 45, 4&ndash;5 in 110 (see the route card)."""
docs = [{ href = "docs/variant-e.html", label = "Notes" }]
layers = "4L"
leds = "45× XL-1615RGBC"
driver = "AW20198QNR, tip pocket"
result = "4 open at 110 min (5 with 0 DRC)"
cost = "−$3.0"

