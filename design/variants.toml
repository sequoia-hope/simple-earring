[[board]]
id = "earring-f-route"
family = "routes"
title = "F routed: seed 3, 6 layers"
badge = "0 open · 2 DRC"
kind = "ok"
specs = ["6 layers", "384 vias", "2,265 tracks", "15 min"]
desc = """Every connection made, GND plane whole. Two DRC errors left, both necks: where U1 pin 15's IMU_SCL
escape meets its via, and a sliver of the In2 3V3 disc. Small hand fixes before a gate-7 review."""
docs = [{ href = "docs/variant-e.html", label = "Notes" }]

[[board]]
id = "earring-e-route"
family = "routes"
title = "E routed: seed 6, 4 layers"
badge = "4 open · 2 DRC"
kind = "probe"
specs = ["4 layers", "450 vias", "2,658 tracks", "110 min"]
desc = """The closest 4-layer result, from a 6,600 s run, with the GND plane whole. Open: CS14, CS6, USB D+ and
VSYS; 2 neck errors at SW3/SW7 vias. Seed 3 reached 5 open with 0 errors. Gains had slowed to about one open
per 20 minutes. USB D+ is open on 4 of 6 seeds, which points to a hand fix at the tip rather than more time."""
docs = [{ href = "docs/variant-e.html", label = "Notes" }]
