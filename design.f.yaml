# Variant F overlay: merged over design.yaml when EARRING_VARIANT=f
# (python3 build.py --variant f). Variant E on 6 layers (design/variant-e.md).
# Variant E is variant D with the back unloaded:
# parts moved off the front LEDs' via room and 1 mm test pads
# (design/variant-e.md). Variant D moved the driver off the LED rings into the
# tip pocket. Variant C is variant
# B with round-pendant's low-density parallelogram parts: the AW20198QNR (QFN-40 5x5, 18 CS x 11 SW) in place of
# the IS31FL3741A, and the XL-1615RGBC-RF (1.6 x 1.5 mm) in place of the
# XL-1010. design/variant-c.md has the why.
leds:
  drive: matrix          # one AW20198QNR (U11) driving plain RGB LEDs
  part: rgb_led_1615     # XL-1615RGBC-RF, common anode on pad 2
  matrix:
    driver: aw20198      # circuit.py DRIVERS
    sw: 9                # SW lines scanned (GCR.SWSEL = 1000) -> duty 0.0984
    per_sw: 5            # LEDs per SW line -> 15 of the 18 CS lines used
    bus: sw              # 9-line SW bus round the ring, CS triplets local
                         # to 9-LED arcs (as variant B's best map)
    bus_rings: false
    arc_triplet: [1, 2, 5, 4, 3]   # arc g (LEDs 9g+1..9g+9) -> CS triplet: west-side
                         # pins (CS1-9) take the west arcs + the tip/inner arc,
                         # east-side pins (CS10-15) the two east arcs
    unload_back: true    # place.py UNLOAD: back parts re-scanned off the LEDs
    spot: tip            # U11 in the back pocket south of J1, clear of every
                         # LED (place.py MATRIX_AW_TIP); U5 + BOOTSEL timer moved
    led_angle: 0         # square to the tangent: at 45 deg the 1.6 x 1.5 mm
                         # bodies leave ~0.1 mm pad to pad at 2.44 mm pitch
    riset: 47k           # REXT: Imax = 400/47k = 8.5 mA (design/parts/aw20198qnr.md)
    riset_part: r_47k
    bulk: 10u            # PVCC bulk
    bulk_part: c_10u_0603
    i2c_pullup: 4.7k     # I2C0, 400 kHz (ds p.11: 4.7k for 400 kHz)
    i2c_pullup_part: r_4k7
board:
  testpoint_part: testpoint_1mm   # TP1-3: 1.0 mm round pads (were 1.5 mm square)
  layers: 6              # variant F: E on 6 layers (user option 2, 2026-11-06)
