# simple_earring — single source of truth for the generated design.
# Edit this file, then run: python3 build.py
#
# High-level goals:
#   - RP2350A (QFN-60) + W25Q16JV QSPI flash on the front
#   - Rechargeable LPR302823 round LiPo taped to the back, on two solder pads
#   - SK6805-EC10 addressable RGB LEDs around the periphery
#   - USB-C for charging (LiPo/LiR charger) and UF2 programming
#   - 4-layer board, JLCPCB rules, all parts sourced at LCSC

board:
  shape: teardrop        # round body + truncated tip (USB) at the top
  round_radius_mm: 15.25 # body radius (29mm dia packed the center too tight)
  tip_len_mm: 20.5       # tip edge distance above center
  tip_width_mm: 9.4      # truncation width = USB connector width
  diameter_mm: 30.5      # legacy value some scripts read for r_board
  layers: 4              # 4 or 6 — the whole pipeline switches on this
  # Layer plan (6):                   Layer plan (4):
  #   F.Cu   - parts (MCU) + signal     F.Cu   - parts (MCU) + signal
  #   In1.Cu - solid GND                In1.Cu - solid GND
  #   In2.Cu - VLED annulus + 3V3 disc  In2.Cu - VLED annulus + 3V3 disc
  #   In3.Cu - signal + east 3V3 pour          (annulus hole pulled in to
  #   In4.Cu - solid VLED                       r 9.35 so the interior LED
  #   B.Cu   - holder side + signal             ring still gets a plane
  #                                             drop; disc shrinks to 9.15)
  #                                     B.Cu   - holder side + signal
  # 4-layer is the TIMELINE choice (JLC ships it faster). What it gives up:
  # the interior LEDs' In4 plane (mitigated above) and the In3 east pour
  # that fed the IMU cluster's 10 back-side 3V3 pads — those must now route
  # as ordinary B.Cu traces. Set this back to 6 to fall back.

leds:
  count: 45              # ring_count perimeter + 3 tip closure + 8 interior
  ring_count: 34         # 2.44mm pitch on the 80.4mm path — matches the
                         # ~2.45mm pitch of the 5-LED tip closure group
  inner_count: 8         # interior ring around the CPU (mirror-symmetric)
  ring_margin_mm: 2.0    # distance from board edge to LED center
  path_end_y: -17.0      # LED path ends between the USB THT legs (y -14.9/-19.1)
  # The last (count - ring_count) LEDs close the teardrop tip on the FRONT
  # (opposite face from the USB connector): a 3-LED chevron with the middle
  # one higher, continuing the chain right-to-left across the tip.
  # LEDs point pin-1/data tangentially; chain daisy-chains around the ring.
  power_rail: VSYS       # rev 2: cell when unplugged, VBUS-0.3V when not.
                         # SK6805 wants 3.7-5.5V; the cell alone only clears
                         # that above ~3.7V, so on USB the ring finally works
                         # at any state of charge. Costs a data level shifter
                         # (Q3/R23) — VIH is 0.7*VLED. Documentation only;
                         # circuit.py owns the actual net.

power:
  battery: LPR302823     # LiPol round LiPo, Ø28 D-cut, 3.0-3.2mm, 140mAh, 3.8V
                         # nominal / 4.35V max, PCM inside the outline (cuts at
                         # 2.75V / 4.355V). Hand-fitted, taped to the back, wired
                         # to BT1's two pads. design/parts/bt1-lipo-cell.md.
                         # Charged to 4.20V on purpose (not the LGS4056H-4.35
                         # variant): the PCM's overcharge trip can be as low as
                         # 4.305V. Rev-2 coin cell (RJD2032C1 in an MY-2032-12-R
                         # clip) is in git history at 4538da2.
  charge_current_ma: 50  # 900/18k; cell max 70mA (0.36C). design/parts/r8-rprog.md
  # Rev 2 splits VBATT (cell only) from VSYS (system), OR'd by D3 from VBUS
  # and Q2 from the cell — so a plugged-in board runs off the cable and the
  # charger's whole program current reaches the cell in either switch
  # position (that is what retired the rev-1 R8 22k->15k rework).
  regulator_3v3: LDO     # battery -> 3.3V LDO for RP2350 IOVDD/VREG_VIN
  led_load_switch: true  # high-side switch so LEDs draw zero when off

usb:
  connector: usb_c       # TYPE-C-31-M-12 right-angle SMD, BACK side at the tip
  overhang_mm: 1.3       # mating face sticks out past the tip edge

jlcpcb:
  stackup: JLC04161H-7628   # 4-layer; 6-layer was JLC06161H-3313
  min_track_mm: 0.127
  min_clearance_mm: 0.127
  default_track_mm: 0.15
  power_track_mm: 0.4    # VBUS netclass width (Sequoia's hand-routed In3 trunk)
  via_drill_mm: 0.2
  via_diameter_mm: 0.4
  assembly_side: both    # MCU front, holder back — JLC does 2-sided SMT
